<style>
  :root { --stage: #0f1013; --gap: 28px; }
  * { box-sizing: border-box; }
  html { background: var(--stage); -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--stage); padding: 28px max(14px, env(safe-area-inset-right)) 48px max(14px, env(safe-area-inset-left)); }
  .deck { max-width: 760px; margin: 0 auto; display: grid; gap: var(--gap); }
  .page { position: relative; width: 100%; aspect-ratio: 1080 / 1350; border-radius: 6px; overflow: hidden; box-shadow: 0 18px 50px rgba(0,0,0,.55); background: #1b1c20; }
  .page img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* exact spots from the 1080x1350 design: reels at x110 / x565, y360, 405x720 */
  .reel { position: absolute; top: 26.6667%; width: 37.5%; height: 53.3333%; border-radius: 1.9%; overflow: hidden; background: #000; }
  .reel video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .r1 { left: 10.1852%; }
  .r2 { left: 52.3148%; }
  .hot { position: absolute; display: block; border-radius: 10px; }
  .hot:focus-visible { outline: 2px solid #f4cf47; outline-offset: 2px; }
  .foot { text-align: center; color: #7d7f88; font: 500 13px/1.5 "Segoe UI", system-ui, sans-serif; margin-top: 8px; }

<script>
  // Reels play (muted, looping) while page 3 is on screen and pause when it scrolls away; tap a reel for sound.
  const vids = document.querySelectorAll('.reel video');
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) e.target.play().catch(() => {}); else e.target.pause(); });
    }, { threshold: 0.35 });
    vids.forEach(v => io.observe(v));
  }
</script>
